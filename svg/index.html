<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: white;
        text-align: center;
      }

      h1 {
        margin-bottom: 30px;
      }

      .zadatak {
        margin-bottom: 50px;
      }

      svg {
        border: 2px solid black;
      }
    </style>
  </head>
  <body>
    <h1>SVG zadaci</h1>

    <div class="zadatak">
      <h2>Zadatak 1</h2>

      <svg width="600" height="450" viewBox="0 0 600 450">
        <rect x="0" y="0" width="600" height="300" fill="lightblue" />

        <rect x="0" y="300" width="600" height="150" fill="royalblue" />

        <circle cx="500" cy="80" r="50" fill="yellow" />

        <rect x="290" y="100" width="10" height="205" fill="black" />

        <polygon points="290,145 220,270 290,270" fill="white" />

        <polygon points="300,145 300,270 370,270" fill="white" />

        <polygon points="290,110 245,125 290,140" fill="green" />

        <rect x="195" y="270" width="210" height="45" fill="firebrick" />
      </svg>
    </div>

    <div class="zadatak">
      <h2>Zadatak 2</h2>

      <svg width="500" height="500" viewBox="0 0 500 500">
        <circle cx="250" cy="300" r="110" fill="#d1495b" />

        <rect x="220" y="175" width="60" height="30" fill="#f4a261" />

        <circle
          cx="250"
          cy="160"
          r="18"
          fill="white"
          stroke="#f4a261"
          stroke-width="4"
        />
      </svg>
    </div>
    <div class="zadatak">
      <h2>Zadatak 3</h2>

      <svg width="600" height="450" viewBox="0 0 600 450">
        <rect x="0" y="0" width="600" height="450" fill="#f3d8b5" />

        <path
          d="M0 300
                   Q150 260 300 290
                   Q450 260 600 300
                   L600 450
                   L0 450 Z"
          fill="#f5f1e3"
        />

        <polygon points="100,90 55,300 145,300" fill="#28745a" />

        <rect x="93" y="300" width="10" height="55" fill="#777b6c" />

        <polygon points="200,135 170,295 230,295" fill="#28745a" />

        <rect x="196" y="295" width="8" height="45" fill="#777b6c" />

        <polygon points="360,140 330,285 390,285" fill="#28745a" />

        <rect x="356" y="285" width="8" height="40" fill="#777b6c" />

        <polygon points="450,115 410,295 490,295" fill="#28745a" />

        <rect x="446" y="295" width="9" height="50" fill="#777b6c" />
      </svg>
    </div>

    <h1>Zadatak 4</h1>
    <svg width="500" height="500">
      <polygon points="300,250 180,410 420,410" fill="#173c2c" />
      <polygon points="300,160 210,330 390,330" fill="#0f6650" />
      <polygon points="300,90 240,230 360,230" fill="#3f8361" />
      <rect x="278" y="410" width="47" height="45" fill="firebrick" />
    </svg>


    <h1>Zadatak 5</h1>
<svg width="600" height="350">

    <!-- MEDENJAK -->

    <!-- Glava -->
    <circle cx="230" cy="80" r="50"
            fill="#D0873C"
            stroke="#D0873C"
            stroke-width="3" />

    <!-- Lijeva ruka -->
    <rect x="130" y="120"
          width="100" height="55"
          rx="25"
          fill="#D0873C" />

    <!-- Desna ruka -->
    <rect x="230" y="120"
          width="100" height="55"
          rx="25"
          fill="#D0873C" />

    <!-- Tijelo -->
    <polygon points="190,145 270,145 295,230 255,300 215,300 175,230"
             fill="#D0873C" />

    <!-- Lijeva noga -->
    <ellipse cx="195" cy="250"
             rx="28" ry="65"
             fill="#D0873C"
             transform="rotate(20 195 250)" />

    <!-- Desna noga -->
    <ellipse cx="265" cy="250"
             rx="28" ry="65"
             fill="#D0873C"
             transform="rotate(-20 265 250)" />

    <!-- Oči -->
    <circle cx="210" cy="70" r="5"
            fill="white" />

    <circle cx="250" cy="70" r="5"
            fill="white" />

    <!-- Usta -->
    <rect x="215" y="92"
          width="30" height="8"
          rx="3"
          fill="none"
          stroke="white"
          stroke-width="4" />

    <!-- Gumbi -->
    <circle cx="230" cy="145" r="8"
            fill="black" />

    <circle cx="230" cy="180" r="8"
            fill="black" />
</svg>
    <h1>Zadatak 6</h1>
    <svg width = "600" height ="800">
    <path d="M 320 500
             A 150 150 0 1 1 320 700
             L 390 600
             Z"
          fill="yellow"
          stroke="black"
          stroke-width="7" />

    <circle cx="390" cy="515" r="23"
            fill="black" />

    </svg>
  </body>
</html>
